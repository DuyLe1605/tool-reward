name: Build & Release Electron App

# ─────────────────────────────────────────────────────────────────
# TRIGGER: chỉ chạy khi push tag có dạng v* (vd: v1.0.0, v9.1.2)
# Cách release: xem RELEASE.md
# ─────────────────────────────────────────────────────────────────
on:
    push:
        tags:
            - "v*"

permissions:
    contents: write # cần để tạo GitHub Release và upload artifacts

jobs:
    build-windows:
        name: Build Windows Installer
        runs-on: windows-latest

        steps:
            # 1. Checkout source code
            - name: Checkout
              uses: actions/checkout@v4

            # 2. Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # 3. Cài dependencies root (electron, electron-builder, playwright, ...)
            - name: Install root dependencies
              run: npm ci

            # 4. Cài dependencies web (React, Vite, ...)
            - name: Install web dependencies
              run: cd web && npm ci

            # 5. Build React frontend → web/dist/
            - name: Build web frontend
              run: npm run web:build

            # 6. Compile TypeScript server + src → dist/
            - name: Compile server TypeScript
              run: npm run build:server

            # 7. Compile TypeScript electron/ → dist-electron/
            - name: Compile electron TypeScript
              run: npm run build:electron

            # 8. Đóng gói và publish lên GitHub Releases
            #    electron-builder tự tạo Release với tag hiện tại, upload:
            #      - RewardsTool-Setup-x.y.z.exe  (installer)
            #      - latest.yml                   (metadata cho auto-updater)
            - name: Package & publish
              run: npm run release:publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Bỏ qua download playwright browsers trong CI (app dùng system Edge)
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
